[workspace]
members = [
    "crates/lib/*",
    "crates/ffi/*",
    "crates/sev"
]
exclude = [
    "crates/ffi/tools",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
edition = "2018"
homepage = "https://github.com/virtee/sev"
repository = "https://github.com/virtee/sev"
description = "Library for AMD SEV"
authors = [
    "Nathaniel McCallum <npmccallum@redhat.com>",
    "The VirTEE Project Developers",
]
readme = "README.md"
keywords = ["amd", "sev"]
categories = [
    "os",
    "os::linux-apis",
    "parsing",
    "network-programming",
    "hardware-support",
]
exclude = [".gitignore", ".github/*"]
rust-version = "1.85.0"

# version required for cargo publish — must match each crate's [package].version
[workspace.dependencies]
sev = { path = "crates/sev", version = "8.0.0", default-features = false }
sev-core = { path = "crates/lib/core", version = "0.1.0" }
sev-complex = { path = "crates/lib/complex", version = "0.1.0" }
sev-polynomials = { path = "crates/lib/polynomials", version = "0.1.0" }
sev-linear-algebra = { path = "crates/lib/linear-algebra", version = "0.1.0" }
sev-trig = { path = "crates/lib/trig", version = "0.1.0" }
sev-sequences = { path = "crates/lib/sequences", version = "0.1.0" }
sev-sev-ffi = { path = "crates/ffi/sev", version = "8.0.0" }
sev-core-ffi = { path = "crates/ffi/core", version = "0.1.0" }
sev-complex-ffi = { path = "crates/ffi/complex", version = "0.1.0" }
sev-polynomials-ffi = { path = "crates/ffi/polynomials", version = "0.1.0" }
sev-linear-algebra-ffi = { path = "crates/ffi/linear-algebra", version = "0.1.0" }
sev-trig-ffi = { path = "crates/ffi/trig", version = "0.1.0" }
sev-sequences-ffi = { path = "crates/ffi/sequences", version = "0.1.0" }
sev-types-ffi = { path = "crates/ffi/types", version = "0.1.0" }
uniffi = { version = "0.31" }
uniffi-runtime-wasm = { version = "0.31.0-6" }
getrandom = { version = "0.2", features = ["js"] }
